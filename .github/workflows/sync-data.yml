name: Sync data.json from OneDrive

on:
  schedule:
    # Runs every 5 minutes — this is GitHub Actions' hard minimum interval
    # for scheduled workflows. It cannot be set any faster than this.
    - cron: '*/5 * * * *'
  workflow_dispatch:
    # Lets you manually trigger this from the GitHub Actions tab any time,
    # without waiting for the next 5-minute cron tick. Use this for testing.

permissions:
  contents: write
  # Required so this workflow's default token is allowed to commit and
  # push data.json back into the repo.

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download data.json from OneDrive
        run: |
          curl -L -f -o data.json.tmp "${{ secrets.ONEDRIVE_DATA_URL }}"

      - name: Validate downloaded file is real JSON before trusting it
        run: |
          if ! python3 -c "import json,sys; d=json.load(open('data.json.tmp')); assert isinstance(d, list) and len(d) > 0" 2>/dev/null; then
            echo "❌ Downloaded file is not a valid non-empty JSON array — aborting."
            echo "   (This usually means the OneDrive link expired, permissions changed,"
            echo "   or OneDrive returned a login/redirect page instead of the file.)"
            exit 1
          fi
          mv data.json.tmp data.json
          echo "✅ Downloaded data.json looks valid."

      - name: Commit and push if data actually changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "No changes to data.json — nothing to commit."
          else
            git commit -m "Auto-sync data.json from OneDrive"
            git push
          fi
